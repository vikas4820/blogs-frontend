<main>
  <div class="table-data">
    <div class="order">
      <div class="head d-flex justify-content-between align-items-center">
        <h3 class="mb-0">Blog List</h3>

        <div class="d-flex align-items-center gap-2">
          <button class="btn btn-primary" [routerLink]="['/user/blogs/create']">
            <i class="bx bx-plus"></i> Create Blog
          </button>
        </div>
      </div>

      <hr />

      <!-- Blogs Available -->
      <ng-container *ngIf="blogs && blogs.length > 0; else noBlogs">
        <table>
          <thead>
            <tr>
              <th>Id</th>
              <th>Title</th>
              <th>Slug</th>
              <th>Status</th>
              <th>Action</th>
            </tr>
          </thead>

          <tbody>
            <tr *ngFor="let blog of blogs">
              <td class="data-id">{{ blog.id }}</td>
              <td>{{ blog.title }}</td>
              <td>{{ blog.slug }}</td>
              <td>
                <span class="status" [ngClass]="blog.status">
                  {{ blog.status.toUpperCase() }}
                </span>
              </td>
              <td>
                <div class="d-flex gap-2">
                  <a 
                    class="btn btn-sm mx-1 btn-outline-primary" 
                    [href]="'/blog/' + blog.slug + '/' + blog.id" 
                    target="_blank" 
                    rel="noopener noreferrer"
                  >
                    <i class="bx bx-show"></i>
                  </a>


                  <button
                    class="btn btn-sm btn-outline-primary"
                    [routerLink]="['/user/blogs/edit', blog.id]"
                  >
                    <i class="bx bx-edit"></i>
                  </button>

                  <button
                    class="btn btn-sm btn-outline-danger"
                    (click)="deleteBlog(blog.id)"
                    *ngIf="userState.isAdmin()"
                  >
                    <i class="bx bx-trash"></i>
                  </button>
                </div>
              </td>
            </tr>
          </tbody>
        </table>

        <!-- Pagination -->
        <nav *ngIf="totalPages > 1" class="mt-5">
          <ul class="pagination justify-content-center">
            <li class="page-item" [class.disabled]="currentPage === 1">
              <a class="page-link" href="javascript:void(0)" (click)="changePage(currentPage - 1)">
                Prev
              </a>
            </li>

            <li
              class="page-item"
              *ngFor="let page of pages"
              [class.active]="page === currentPage"
            >
              <a class="page-link" href="javascript:void(0)" (click)="changePage(page)">
                {{ page }}
              </a>
            </li>

            <li class="page-item" [class.disabled]="currentPage === totalPages">
              <a class="page-link" href="javascript:void(0)" (click)="changePage(currentPage + 1)">
                Next
              </a>
            </li>
          </ul>
        </nav>
      </ng-container>

      <!-- No Blogs -->
      <ng-template #noBlogs>
        <div class="text-center py-5">
          <h5 class="mb-2">No blogs yet ✍️</h5>
          <p class="text-muted">
            Start sharing your thoughts and ideas with the world.
            Create your first blog now!
          </p>
          <button class="btn btn-primary mt-2" [routerLink]="['/user/blogs/create']">
            <i class="bx bx-plus"></i> Create Your First Blog
          </button>
        </div>
      </ng-template>
    </div>
  </div>
</main>
