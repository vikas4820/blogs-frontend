<main>
  <div class="table-data">
    <div class="order">
      <div class="head">
        <h3>Create Blog</h3>
      </div>
      <hr />

      <form [formGroup]="blogForm" (ngSubmit)="submitForm()" class="blog-form">
        <div class="form-group">
          <label>Blog Title *</label>
          <input type="text" formControlName="title" placeholder="Enter blog title" (input)="onTitleChange()"/>
          <small *ngIf="blogForm.get('title')?.touched && blogForm.get('title')?.invalid">
            <span *ngIf="blogForm.get('title')?.errors?.['required']"> Title is required </span>
            <span *ngIf="blogForm.get('title')?.errors?.['minlength']">
              Title must be at least 5 characters
            </span>
          </small>
        </div>

        <div class="form-group">
          <label>Slug *</label>
          <input type="text" formControlName="slug" placeholder="blog-slug-will-be-generated-automatically" readonly/>
          <small *ngIf="blogForm.get('slug')?.touched && blogForm.get('slug')?.invalid">
            Slug is required
          </small>
        </div>

        <div class="form-group">
          <label>Category *</label>
          <select formControlName="blogCategory">
            <option value="">Select category</option>
            <option *ngFor="let cat of categories" [value]="cat.id">
              {{ cat.categoryName }}
            </option>
          </select>
          <small *ngIf="blogForm.get('blogCategory')?.touched && blogForm.get('blogCategory')?.invalid">
            Category is required
          </small>
        </div>

        <div class="form-group">
          <label>Short Description *</label>
          <quill-editor
            formControlName="shortDescription"
            [styles]="{ height: '100px' }"
            placeholder="Short summary of blog"
          >
          </quill-editor>
          <small
            *ngIf="
              blogForm.get('shortDescription')?.touched && blogForm.get('shortDescription')?.invalid
            "
          >
            Short description is required
          </small>
        </div>

        <div class="form-group">
          <label>Blog Content *</label>
          <quill-editor
            formControlName="content"
            [styles]="{ height: '300px' }"
            placeholder="Write full blog content"
          >
          </quill-editor>
          <small *ngIf="blogForm.get('content')?.touched && blogForm.get('content')?.invalid">
            Content is required
          </small>
        </div>

        <div class="form-group">
          <label>Featured Images (Max 3) *</label>
          <input
            type="file"
            multiple
            accept="image/*"
            (change)="onFileChange($event)"
          />
          <small *ngIf="imageError" class="error">
            Please upload 1 to 3 images only
          </small>
        </div>

        <div class="image-preview mb-3">
          <div class="preview-item" *ngFor="let img of imagePreviews; let i = index">
            <img [src]="img" />
            <button type="button" (click)="removeImage(i)">✕</button>
          </div>
        </div>

        <div class="form-group" *ngIf="userState.isAdmin()">
          <label>Meta Title</label>
          <input type="text" formControlName="metaTitle" placeholder="SEO meta title" />
        </div>

        <div class="form-group" *ngIf="userState.isAdmin()">
          <label>Meta Description</label>
          <textarea
            rows="2"
            formControlName="metaDescription"
            placeholder="SEO meta description"
          ></textarea>
        </div>

        <div class="form-group" *ngIf="userState.isAdmin()">
          <label>Status *</label>
          <select formControlName="status">
            <option value="active">Active</option>
            <option value="draft">Draft</option>
          </select>
        </div>

        <button type="submit" [disabled]="blogForm.invalid || imageError">{{ blogId ? "Update" : "Create" }} Blog</button>
      </form>
    </div>
  </div>
</main>
