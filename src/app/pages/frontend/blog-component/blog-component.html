      <div class="col-12 mb-3">
        <div class="post-slider">
          <!-- Single Image -->
          <ng-container *ngIf="blogImages.length === 1">
            <img [src]="blogImages[0]" class="img-fluid" alt="post-thumb" />
          </ng-container>
      
          <!-- Carousel for 2 or more images -->
          <ng-container *ngIf="blogImages.length > 1">
            <div id="blogSlider" class="carousel slide" data-ride="carousel">
              <ol class="carousel-indicators">
                <li *ngFor="let img of blogImages; let i = index"
                    [class.active]="i === 0"
                    data-target="#blogSlider"
                    [attr.data-slide-to]="i">
                </li>
              </ol>
      
              <div class="carousel-inner">
                <div *ngFor="let img of blogImages; let i = index" class="carousel-item" [class.active]="i === 0">
                  <img [src]="img" class="d-block w-100 img-fluid" alt="post-image">
                </div>
              </div>
      
              <a class="carousel-control-prev" href="#blogSlider" role="button" data-slide="prev">
                <span class="carousel-control-prev-icon"></span>
              </a>
              <a class="carousel-control-next" href="#blogSlider" role="button" data-slide="next">
                <span class="carousel-control-next-icon"></span>
              </a>
            </div>
          </ng-container>
        </div>
      </div>
      
      <div class="col-lg-10 mx-auto">
        <div class="content">
          <!-- <p>{{ blog?.content }}</p> -->
          <div class="content" [innerHTML]="blog?.content"></div>
        </div>
